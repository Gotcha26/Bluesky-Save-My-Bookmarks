name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Lancer les tests
        run: python -m pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier la syntaxe Python
        run: python -m py_compile bsmb.py && echo "Syntaxe OK"

      - name: Vérifier les modules core
        run: |
          for f in core/auth.py core/config.py core/database.py core/colors.py; do
            python -m py_compile "$f" && echo "$f OK"
          done

      - name: Vérifier les modules api
        run: |
          for f in api/post_analyzer.py api/repost_resolver.py; do
            python -m py_compile "$f" && echo "$f OK"
          done
