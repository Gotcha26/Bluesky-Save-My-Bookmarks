[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bsmb"
dynamic = ["version"]
description = "Bsky Save My Bookmarks : archive localement les médias et textes de vos bookmarks Bluesky."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]

[project.scripts]
bsmb = "bsmb:main"

[tool.setuptools.dynamic]
version = {attr = "core.version.__version__"}

[tool.setuptools]
py-modules = ["bsmb"]
packages = ["core", "api", "downloaders"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Copie de Tools/i18n/msgfmt.py de CPython : on garde son style d'origine
"tools/msgfmt.py" = ["E741", "F821", "UP031"]
